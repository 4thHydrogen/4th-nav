<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Nav 导航助手 - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Nav 导航助手 - 设置</h1>

    <div class="form-group">
      <label for="serverUrl">服务器地址</label>
      <input type="url" id="serverUrl" placeholder="http://localhost:6412">
      <p class="hint">你的 Nav 导航站地址，如 http://localhost:6412</p>
    </div>

    <div class="form-group">
      <label for="apiToken">API Token</label>
      <input type="text" id="apiToken" placeholder="在管理后台生成的 API Token">
      <p class="hint">在导航站管理后台 → API Token 管理中生成，有效期 100 年</p>
    </div>

    <div class="actions">
      <button id="testBtn">测试连接</button>
      <button id="saveBtn" class="primary">保存设置</button>
    </div>

    <div id="status" class="status" style="display:none;"></div>
  </div>

  <script src="../lib/api.js"></script>
  <script src="options.js"></script>
</body>
</html>
