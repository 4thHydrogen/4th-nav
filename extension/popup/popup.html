<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
      background: #fff;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #eee;
    }

    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: none;
      color: #999;
      transition: color 0.2s;
    }

    .tab:hover { color: #666; }

    .tab.active {
      color: #4a90d9;
      font-weight: 500;
      border-bottom: 2px solid #4a90d9;
    }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* Save tab */
    .current-page {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    .current-page img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .current-page-info {
      overflow: hidden;
      flex: 1;
    }

    .current-page-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-page-url {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-row {
      margin-bottom: 12px;
    }

    .form-row label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #555;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-row textarea {
      height: 60px;
      padding: 8px 10px;
      resize: none;
    }

    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      border-color: #4a90d9;
    }

    .save-btn {
      width: 100%;
      height: 38px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover { background: #3a7bc8; }
    .save-btn:disabled { background: #b0c4de; cursor: not-allowed; }

    /* Manage tab */
    .manage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .manage-header span {
      font-size: 13px;
      color: #666;
    }

    .refresh-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #666;
    }

    .refresh-btn:hover { background: #f5f5f5; }

    .category-section {
      margin-bottom: 12px;
    }

    .category-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 4px;
    }

    .tool-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .tool-item:hover { background: #f8f9fa; }

    .tool-item img {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .tool-item-name {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .tool-item:hover .tool-item-actions { opacity: 1; }

    .tool-item-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .tool-item-actions .edit-btn:hover { background: #e3f2fd; }
    .tool-item-actions .delete-btn:hover { background: #fce4ec; }

    /* Edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      width: 340px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 15px;
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .modal-actions button {
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      color: #333;
    }

    .modal-actions button.primary {
      background: #4a90d9;
      color: #fff;
      border-color: #4a90d9;
    }

    /* Status messages */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 200;
      animation: fadeInUp 0.2s ease-out;
    }

    .toast.success { background: #e8f5e9; color: #2e7d32; }
    .toast.error { background: #fce4ec; color: #c62828; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 30px 0;
      color: #999;
      font-size: 13px;
    }

    .loading { text-align: center; padding: 20px; color: #999; font-size: 13px; }

    .no-config {
      text-align: center;
      padding: 30px 16px;
    }

    .no-config p {
      font-size: 13px;
      color: #999;
      margin-bottom: 12px;
    }

    .no-config a {
      color: #4a90d9;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-tab="save">保存</button>
    <button class="tab" data-tab="manage">管理</button>
  </div>

  <div id="saveTab" class="tab-content active">
    <div id="noConfig" class="no-config" style="display:none;">
      <p>请先配置服务器地址和 API Token</p>
      <a id="openOptions">打开设置</a>
    </div>

    <div id="saveForm" style="display:none;">
      <div class="current-page">
        <img id="favicon" src="" alt="">
        <div class="current-page-info">
          <div class="current-page-title" id="pageTitle"></div>
          <div class="current-page-url" id="pageUrl"></div>
        </div>
      </div>

      <div class="form-row">
        <label>名称</label>
        <input type="text" id="toolName" placeholder="书签名称">
      </div>

      <div class="form-row">
        <label>分类</label>
        <input type="text" id="toolCatelog" list="catelogList" placeholder="选择或输入分类">
        <datalist id="catelogList"></datalist>
      </div>

      <div class="form-row">
        <label>描述（可选）</label>
        <textarea id="toolDesc" placeholder="简短描述这个网站"></textarea>
      </div>

      <button class="save-btn" id="saveBtn">保存到导航站</button>
    </div>
  </div>

  <div id="manageTab" class="tab-content">
    <div class="manage-header">
      <span id="toolCount">加载中...</span>
      <button class="refresh-btn" id="refreshBtn">刷新</button>
    </div>
    <div id="toolList"></div>
  </div>

  <!-- Edit modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>编辑书签</h3>
      <div class="form-row">
        <label>名称</label>
        <input type="text" id="editName">
      </div>
      <div class="form-row">
        <label>URL</label>
        <input type="url" id="editUrl">
      </div>
      <div class="form-row">
        <label>分类</label>
        <input type="text" id="editCatelog" list="editCatelogList">
        <datalist id="editCatelogList"></datalist>
      </div>
      <div class="form-row">
        <label>描述</label>
        <textarea id="editDesc"></textarea>
      </div>
      <div class="modal-actions">
        <button id="editCancel">取消</button>
        <button class="primary" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <script src="../lib/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
